pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven {
            url 'https://www.jitpack.io'
            content {
                excludeGroupByRegex "com\\.gitlab\\.grrfe.*"
            }
        }
        maven { url 'https://gitlab.com/api/v4/projects/47594051/packages/maven' }
        maven { url 'https://gitlab.com/api/v4/projects/23062172/packages/maven' }
        maven { url 'https://gitlab.com/api/v4/projects/72253145/packages/maven' }
        maven { url 'https://gitlab.com/api/v4/projects/69501388/packages/maven' }
    }
}
rootProject.name = "bahamut-BBS-2"
include ':app'
